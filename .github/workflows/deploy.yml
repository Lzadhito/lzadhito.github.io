# Lives in the private `site` repo. Builds the Astro project and force-pushes dist/ to the
# public lzadhito.github.io repo, so drafts and unpublished posts never reach public history.
name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ['content/drafts/**'] # draft autosync never builds
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx @google/design.md lint DESIGN.md
      - run: npm run build # writes dist/version.json with $GITHUB_SHA
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: lzadhito/lzadhito.github.io
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true # public repo keeps no history
